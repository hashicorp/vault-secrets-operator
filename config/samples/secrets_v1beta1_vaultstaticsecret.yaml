---
apiVersion: v1
kind: Secret
metadata:
  name: secret1
  namespace: tenant-1
type: Opaque
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  namespace: tenant-1
  name: vaultstaticsecret-sample-tenant-1
spec:
  # namespace: cluster1/tenant-1
  vaultAuthRef: vaultauth-sample
  mount: kvv2
  type: kv-v2
  path: secret
  refreshAfter: 5s
  destination:
    name: secret1
---
apiVersion: v1
kind: Secret
metadata:
  name: secret1
  namespace: tenant-2
type: Opaque
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  namespace: tenant-2
  name: vaultstaticsecret-sample-tenant-2
spec:
  # namespace: cluster1/tenant-2
  vaultAuthRef: vaultauth-sample
  mount: kvv1
  type: kv-v1
  path: secret
  refreshAfter: 5s
  destination:
    name: secret1
---
apiVersion: v1
kind: Secret
metadata:
  name: combined-secret
  namespace: tenant-1
type: Opaque
---
# Aggregates individual keys from several Vault secrets under the `kvv2` mount
# into a single Kubernetes Secret. Each `data` entry is a reference of the form
# SECRET_PATH#KEY[#VERSION], where SECRET_PATH is relative to `mount` and
# VERSION is an optional kv-v2 version.
#
# `path` may be set alongside `data`, in which case the secret at `path` is
# synced first and the `data` keys are overlaid on top of it.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  namespace: tenant-1
  name: vaultstaticsecret-sample-aggregated
spec:
  vaultAuthRef: vaultauth-sample
  mount: kvv2
  type: kv-v2
  refreshAfter: 5s
  data:
    db-user: db1/schema1#db-user
    # pinned to version 2 of the Vault secret
    db-password: db1/schema1#db-password#2
    token: app1#token
  destination:
    name: combined-secret
---
apiVersion: v1
kind: Pod
metadata:
  name: app1
  namespace: tenant-1
spec:
  containers:
  - name: nginx
    image: nginx
    volumeMounts:
    - name: secrets
      mountPath: "/etc/secrets"
      readOnly: true
  volumes:
  - name: secrets
    secret:
      secretName: secret1
      optional: false # default setting; "mysecret" must exist
---
apiVersion: v1
kind: Pod
metadata:
  name: app1
  namespace: tenant-2
spec:
  containers:
  - name: nginx
    image: nginx
    volumeMounts:
    - name: secrets
      mountPath: "/etc/secrets"
      readOnly: true
  volumes:
  - name: secrets
    secret:
      secretName: secret1
      optional: false # default setting; "mysecret" must exist
