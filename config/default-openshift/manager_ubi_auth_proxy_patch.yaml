# This patch sets OpenShift-specific configuration for the controller manager.
#
# NOTE: The kube-rbac-proxy sidecar (previously pinned here to a UBI-based
# registry.redhat.io image) has been removed. The metrics endpoint is now
# protected in-process by controller-runtime's
# filters.WithAuthenticationAndAuthorization, so no proxy image is required.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
spec:
  template:
    spec:
      containers:
      - name: manager
