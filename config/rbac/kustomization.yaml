resources:
# All RBAC will be applied under this service account in
# the deployment namespace. You may comment out this resource
# if your manager will use a service account that exists at
# runtime. Be sure to update RoleBinding and ClusterRoleBinding
# subjects if changing service account names.
- service_account.yaml
- role.yaml
- role_binding.yaml
- leader_election_role.yaml
- leader_election_role_binding.yaml
# The following resources support the metrics endpoint and its in-process
# authn/authz protection (filters.WithAuthenticationAndAuthorization):
#   auth_proxy_service.yaml            - Service exposing /metrics over HTTPS
#   auth_proxy_role.yaml               - allows the manager to create
#                                        TokenReviews/SubjectAccessReviews
#   auth_proxy_role_binding.yaml       - binds the above to the manager
#   auth_proxy_client_clusterrole.yaml - metrics-reader role for scrapers
#
# To serve /metrics without authn/authz you must change BOTH places, because
# the mode is decided by the manager's flags, not by these resources:
#   1. set --metrics-secure=false (and pick a plain-HTTP bind address) in
#      config/default/manager_auth_proxy_patch.yaml
#   2. comment out the four resources below
#
# Commenting out only the resources below leaves --metrics-secure=true, so the
# manager keeps requiring authn/authz while losing the Service and the
# TokenReview/SubjectAccessReview permissions it needs to perform it. Metrics
# then become unreachable rather than unauthenticated.
- auth_proxy_service.yaml
- auth_proxy_role.yaml
- auth_proxy_role_binding.yaml
- auth_proxy_client_clusterrole.yaml
